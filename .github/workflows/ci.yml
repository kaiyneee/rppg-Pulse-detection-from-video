# CI (п.40 требований): pytest на push/PR, прогон на 3 версиях Python.
#
# ЧЕСТНАЯ ОГОВОРКА: этот файл написан и локально проверен НАСТОЛЬКО, насколько
# это возможно без реального GitHub-раннера (т.е. сама команда `pytest`
# проверена локально с теми же точными версиями зависимостей, см.
# requirements.txt), но фактическое выполнение на GitHub Actions не
# наблюдалось в этой среде разработки (нет доступа к CI-раннерам) — первый
# реальный push покажет, если модели models/face_landmarker.task (она
# закоммичена в репозиторий, см. git ls-files) или системным библиотекам
# OpenCV на Linux-раннере чего-то не хватает.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9.6 — версия, на которой реально разрабатывался и тестировался
        # код (см. requirements.txt); 3.11/3.12 — smoke-test совместимости
        # ТЕХ ЖЕ точных пинов на более новых интерпретаторах.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies for OpenCV/MediaPipe (headless Linux)
        # libgles2 отдельно от libgl1: MediaPipe на Linux инициализирует
        # EGL/GLES-контекст (см. gl_context.cc в логах) даже при delegate=CPU
        # — без libGLESv2.so.2 инициализация падает ДО того, как код
        # доходит до реальных вычислений. libgl1-mesa-glx/libgles2-mesa —
        # устаревшие transitional-пакеты, на Ubuntu 24.04 (ubuntu-latest)
        # заменены на libgl1/libgles2.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgles2 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v
