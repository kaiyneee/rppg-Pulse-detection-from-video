[pytest]
# п.40 требований: pytest вместо ручного запуска test_signal_pipeline.py как
# скрипта. pythonpath=src убирает необходимость PYTHONPATH=src в команде —
# см. .github/workflows/ci.yml, где эта же команда прогоняется в CI.
pythonpath = src
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
